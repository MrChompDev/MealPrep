<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Subscription – MealPrep</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    .sub-container { max-width: 900px; margin: 40px auto; }
    .meal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }
    .meal-card {
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 10px;
      cursor: pointer;
      transition: 0.2s;
    }
    .meal-card:hover {
      background: #f7f7f7;
    }
    .meal-card.selected {
      border-color: #2e7d32;
      box-shadow: 0 0 0 2px #2e7d32;
      background: #e8f5e9;
    }
    .btn {
      padding: 10px 16px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      background: #2e7d32;
      color: #fff;
      margin-top: 15px;
    }
    .btn-danger {
      background: #c62828;
    }
  </style>
</head>
<body>

<header>
  <div class="logo">MealPrep</div>
  <nav>
    <a href="/">Home</a>
    <a href="/meals">Meals</a>
    <a href="/subscription">Subscription</a>
    <a href="/my_subscription" class="active">My Subscription</a>
    <a href="/tracking">Tracking</a>
    <a href="/admin" id="admin-link" style="display:none;">Admin</a>

    <div id="login-links" style="display:flex; gap:10px;">
      <a href="/login">Login</a>
      <a href="/register">Register</a>
    </div>

    <div id="profile-area" style="display:none; gap:10px;">
      <span id="profile-name"></span>
      <a href="/logout">Logout</a>
    </div>
  </nav>
</header>

<main class="sub-container">
  <h1>My Subscription</h1>
  <div id="sub-info"></div>

  <h2 id="meal-title">Weekly Meal Selection</h2>
  <p id="selection-hint"></p>

  <div id="meal-grid" class="meal-grid"></div>

  <button class="btn" id="saveMealsBtn">Save Selection</button>
  <button class="btn" id="skipWeekBtn" style="background:#ff9800;">Skip This Week</button>
  <button class="btn btn-danger" id="cancelSubscriptionBtn">Cancel Subscription</button>

  <h2>History</h2>
  <div id="history"></div>

  <p id="status"></p>
</main>

<script>
let ALL_MEALS = [];
let selectedIds = [];
let REQUIRED_COUNT = 0;

// ---------------------------------------------------------
// Load subscription + meals
// ---------------------------------------------------------
async function loadData() {
  const subRes = await fetch("/api/subscription/get");
  const subData = await subRes.json();

  if (!subData.subscription) {
    document.getElementById("sub-info").innerText = "You don't have an active subscription.";
    return;
  }

  const sub = subData.subscription;

  // Load meals
  const meals = await fetch("/api/meals").then(r => r.json());
  ALL_MEALS = meals;

  // Load plan info
  const plans = await fetch("/api/subscription/plans").then(r => r.json());
  const plan = plans.plans.find(p => p.id === sub.plan_id);

  REQUIRED_COUNT = plan.meals_per_week;

  // Display subscription info
  document.getElementById("sub-info").innerHTML = `
    <p><strong>Plan:</strong> ${plan.meals_per_week} meals × ${plan.servings_per_meal} servings</p>
    <p><strong>Add‑ons:</strong> ${sub.addons.join(", ") || "None"}</p>
    <p><strong>Next Renewal:</strong> ${sub.next_renewal}</p>
  `;

  document.getElementById("selection-hint").innerText =
    \`Select exactly \${REQUIRED_COUNT} meals.\`;

  // Load selected meals for this week
  const week = sub.weeks?.find(w => w.week_start === getCurrentWeekStart());
  selectedIds = week?.meals || [];

  renderMeals();
  loadHistory();
}

// ---------------------------------------------------------
// Render meal cards
// ---------------------------------------------------------
function renderMeals() {
  const grid = document.getElementById("meal-grid");
  grid.innerHTML = "";

  ALL_MEALS.forEach(m => {
    const isSelected = selectedIds.includes(m.id);
    grid.innerHTML += `
      <div class="meal-card ${isSelected ? "selected" : ""}" onclick="toggleMeal(${m.id})">
        <h3>${m.name}</h3>
        <p>${m.description}</p>
      </div>
    `;
  });

  document.getElementById("selection-hint").innerText =
    \`Select exactly \${REQUIRED_COUNT} meals. Currently selected: \${selectedIds.length}\`;
}

function toggleMeal(id) {
  if (selectedIds.includes(id)) {
    selectedIds = selectedIds.filter(x => x !== id);
  } else {
    if (selectedIds.length >= REQUIRED_COUNT) {
      alert(\`You can only select \${REQUIRED_COUNT} meals.\`);
      return;
    }
    selectedIds.push(id);
  }
  renderMeals();
}

// ---------------------------------------------------------
// Save weekly meals
// ---------------------------------------------------------
async function saveSelection() {
  if (selectedIds.length !== REQUIRED_COUNT) {
    alert(\`You must select exactly \${REQUIRED_COUNT} meals.\`);
    return;
  }

  const res = await fetch("/api/subscription/select_meals", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ meals: selectedIds })
  });

  const data = await res.json();
  document.getElementById("status").innerText = JSON.stringify(data);

  if (data.success) alert("Weekly meals saved!");
}

// ---------------------------------------------------------
// Skip week
// ---------------------------------------------------------
async function skipWeek() {
  const res = await fetch("/api/subscription/skip_week", {
    method: "POST",
    headers: { "Content-Type": "application/json" }
  });

  const data = await res.json();
  document.getElementById("status").innerText = JSON.stringify(data);

  if (data.success) alert("Week skipped.");
}

// ---------------------------------------------------------
// Cancel subscription
// ---------------------------------------------------------
async function cancelSubscription() {
  if (!confirm("Are you sure you want to cancel your subscription?")) return;

  const res = await fetch("/api/subscription/cancel", {
    method: "POST",
    headers: { "Content-Type": "application/json" }
  });

  const data = await res.json();

  if (data.success) {
    alert("Subscription cancelled.");
    window.location.href = "/subscription";
  }
}

// ---------------------------------------------------------
// Load history
// ---------------------------------------------------------
async function loadHistory() {
  const res = await fetch("/api/subscription/history");
  const data = await res.json();

  const div = document.getElementById("history");
  div.innerHTML = "";

  data.history.forEach(h => {
    div.innerHTML += `<p>${h.timestamp}: ${h.type}</p>`;
  });
}

// ---------------------------------------------------------
// Helpers
// ---------------------------------------------------------
function getCurrentWeekStart() {
  const today = new Date();
  const monday = new Date(today.setDate(today.getDate() - today.getDay() + 1));
  return monday.toISOString().split("T")[0];
}

// ---------------------------------------------------------
loadData();
</script>

</body>
</html>
