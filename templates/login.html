<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login – MealPrep</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

<header>
  <div class="logo">MealPrep</div>

  <nav>
    <a href="/">Home</a>
    <a href="/meals">Meals</a>
    <a href="/tracking">Tracking</a>

    <!-- Hidden on login page -->
    <div id="login-links" style="display:none;"></div>

    <div id="profile-area" style="display:none; gap:10px;">
      <span id="profile-name"></span>
      <a href="/logout" class="btn-logout">Logout</a>
    </div>
  </nav>
</header>

<main class="auth-container">
  <h1>Login</h1>

  <form id="login-form" class="auth-form">
    <label>Email</label>
    <input type="email" id="email" required>

    <label>Password</label>
    <input type="password" id="password" required>

    <button type="submit" class="btn-primary">Login</button>
  </form>

  <p>Don't have an account? <a href="/register">Register here</a></p>
</main>

<script>
// LOGIN FORM HANDLER
document.addEventListener("DOMContentLoaded", () => {
  const form = document.getElementById("login-form");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    // Disable button during request
    const submitBtn = form.querySelector('button[type="submit"]');
    submitBtn.disabled = true;
    submitBtn.textContent = "Logging in...";

    try {
      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, password })
      });

      if (!res.ok) {
        const errorData = await res.json().catch(() => ({}));
        throw new Error(errorData.error || `HTTP ${res.status}`);
      }

      const data = await res.json();

      if (data.success) {
        // API returns user object under data.user — detect admin from email
        const isAdmin = data.user && data.user.email === "admin@mealprep.com";
        const isDeveloper = data.user && data.user.email === "dev@mealprep.com";
        
        // Redirect to the proper route
        if (isAdmin) {
          window.location.href = "/admin";
        } else if (isDeveloper) {
          window.location.href = "/developer";
        } else {
          window.location.href = "/my_orders";
        }
      } else {
        alert(data.error || "Invalid login.");
      }
    } catch (error) {
      console.error("Login error:", error);
      alert(error.message || "Login failed. Please try again.");
    } finally {
      // Re-enable button
      submitBtn.disabled = false;
      submitBtn.textContent = "Login";
    }
  });
});
</script>

<script>
// SPECIAL SESSION CHECK FOR LOGIN PAGE
async function checkSession() {
  try {
    const res = await fetch("/api/my_orders");

    if (res.status === 200) {
      // already logged in — go to My Orders
      window.location.href = "/my_orders";
    } else {
      document.getElementById("profile-area").style.display = "none";
      document.getElementById("login-links").style.display = "none";
    }
  } catch (e) {
    // Network error or server not responding - stay on login page
    document.getElementById("profile-area").style.display = "none";
    document.getElementById("login-links").style.display = "none";
  }
}

checkSession();
</script>

</body>
</html>
