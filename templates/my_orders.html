<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>My Orders – MealPrep</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
<header>
  <div class="logo">MealPrep</div>
  <nav>
    <a href="/">Home</a>
    <a href="/meals">Meals</a>
    <a href="/profile">Profile</a>
    <a href="/logout">Logout</a>
  </nav>
</header>
<main>
  <h1>Your Orders</h1>
  <div id="orders" class="grid"></div>
</main>
<script>
async function loadOrders() {
  const res = await fetch("/api/my_orders");
  const data = await res.json();
  const container = document.getElementById("orders");
  container.innerHTML = "";
  data.forEach(o => {
    const div = document.createElement("div");
    div.className = "card";
    div.innerHTML = `
      <h3>Order ${o.order_id}</h3>
      <p>Status: ${o.status}</p>
      <p>ETA: ${o.eta}</p>
      <p>Paid: ${o.paid ? "Yes" : "No"}</p>
      <button onclick="pay('${o.order_id}')">Pay now</button>
    `;
    container.appendChild(div);
  });
}
async function pay(id) {
  await fetch("/api/pay", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({order_id: id})
  });
  loadOrders();
}
loadOrders();
</script>
</body>
</html>
